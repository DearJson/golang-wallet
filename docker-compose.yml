version: '3.8'

services:
  # 主应用服务 - 钱包管理系统
  wallet-app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: wallet-app
    restart: unless-stopped
    ports:
      - "9090:9090"
    depends_on:
      - mysql
      - redis
      - rabbitmq
    environment:
      - TZ=Asia/Shanghai
    volumes:
      # 只挂载必要的可写目录
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - wallet-network
    # 安全加固配置 - "锁死"容器
    security_opt:
      - no-new-privileges:true  # 禁止获取新权限
      - apparmor:docker-default # 使用AppArmor安全配置
    cap_drop:
      - ALL  # 移除所有Linux capabilities
    cap_add:
      - NET_BIND_SERVICE  # 只添加绑定端口的权限
    read_only: false  # 由于需要写日志，暂时不设为只读
    tmpfs:
      - /tmp:size=100M,noexec,nosuid,nodev  # 临时文件系统
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: wallet-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: wallet
      MYSQL_USER: wallet
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wallet123}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    networks:
      - wallet-network
    ports:
      - "3307:3306"
    # MySQL安全加固
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    command: 
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=1000
      - --innodb_buffer_pool_size=256M
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: wallet-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123}
    volumes:
      - redis_data:/data
    networks:
      - wallet-network
    ports:
      - "6379:6379"
    # Redis安全加固
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # RabbitMQ消息队列
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: wallet-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin123}
      TZ: Asia/Shanghai
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - wallet-network
    ports:
      - "5672:5672"   # AMQP端口
      - "15672:15672" # 管理界面端口
    # RabbitMQ安全加固
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

# 网络配置
networks:
  wallet-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16

# 数据卷
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local 