version: '3.8'

# 生产环境配置 - 最大化安全性和性能
services:
  # 主应用服务 - 生产环境加固版
  wallet-app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: wallet-app-prod
    restart: always
    ports:
      - "9090:9090"
    depends_on:
      - mysql
      - redis
      - rabbitmq
    environment:
      - TZ=Asia/Shanghai
      - APP_ENV=production
      - APP_DEBUG=false
    volumes:
      # 只读配置文件
      - ./config:/app/config:ro
      # 可写数据目录
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - wallet-network
    # 生产环境最大安全配置
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
      - seccomp:unconfined  # 根据需要调整
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: false  # 由于日志需求
    tmpfs:
      - /tmp:size=50M,noexec,nosuid,nodev
    ulimits:
      nproc: 32768
      nofile:
        soft: 32768
        hard: 32768
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 120s
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # MySQL - 生产环境优化
  mysql:
    image: mysql:8.0
    container_name: wallet-mysql-prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: wallet
      MYSQL_USER: wallet
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
      - ./mysql/conf.d:/etc/mysql/conf.d:ro  # 自定义配置
    networks:
      - wallet-network
    # 生产环境不暴露端口到宿主机
    expose:
      - "3306"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    command: 
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=1000
      - --innodb_buffer_pool_size=512M
      - --innodb_log_file_size=256M
      - --innodb_flush_log_at_trx_commit=2
      - --query_cache_size=0
      - --query_cache_type=0
      - --sync_binlog=1
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis - 生产环境优化
  redis:
    image: redis:7-alpine
    container_name: wallet-redis-prod
    restart: always
    command: 
      - redis-server
      - --appendonly yes
      - --requirepass ${REDIS_PASSWORD}
      - --maxmemory 256mb
      - --maxmemory-policy allkeys-lru
      - --save 900 1
      - --save 300 10
      - --save 60 10000
    volumes:
      - redis_data:/data
    networks:
      - wallet-network
    expose:
      - "6379"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # RabbitMQ - 生产环境优化
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: wallet-rabbitmq-prod
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      TZ: Asia/Shanghai
      RABBITMQ_VM_MEMORY_HIGH_WATERMARK: 0.6
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - wallet-network
    # 生产环境建议通过nginx代理管理界面
    expose:
      - "5672"
      - "15672"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx反向代理 (生产环境推荐)
  nginx:
    image: nginx:alpine
    container_name: wallet-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro  # SSL证书
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - wallet-app
    networks:
      - wallet-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

# 网络配置 - 生产环境隔离
networks:
  wallet-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-wallet-prod
    ipam:
      driver: default
      config:
        - subnet: 172.21.0.0/16
          gateway: 172.21.0.1

# 数据卷 - 生产环境持久化
volumes:
  mysql_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/mysql
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/redis
  rabbitmq_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/rabbitmq 